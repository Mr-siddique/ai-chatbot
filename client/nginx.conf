server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Matches the server's JSON body limit (16 KB) with headroom.
  client_max_body_size 32k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Same-origin API: /api/auth/login → http://server:4000/auth/login.
  # The trailing slash on proxy_pass strips the /api prefix.
  location /api/ {
    proxy_pass http://server:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI replies can take 30+ seconds.
    proxy_read_timeout 90s;
  }

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths serve index.html (never cached).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
