# Full stack on http://localhost:8080
#   cp .env.example .env   # set JWT_SECRET and OPENROUTER_API_KEY
#   docker compose up --build
#
# Uses the bundled MongoDB unless MONGODB_URI is set in .env (e.g. an Atlas URI).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published to the host: only the server talks to it.

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/ai-support}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      # Plain http on localhost: the Secure cookie flag would be dropped by some browsers.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # nginx is the one proxy in front of the server.
      TRUST_PROXY: "1"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
